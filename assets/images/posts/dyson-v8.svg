<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Dyson V8 開箱封面圖佔位">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b199"/>
      <stop offset="100%" stop-color="#c96f4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#g1)"/>
  <circle cx="980" cy="120" r="220" fill="#ffffff" opacity="0.08"/>
