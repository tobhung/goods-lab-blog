<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="小米掃拖機器人開箱封面圖佔位">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c6b3"/>
      <stop offset="100%" stop-color="#b85f3b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#g2)"/>
  <circle cx="150" cy="100" r="200" fill="#ffffff" opacity="0.08"/>
  <circle cx="1050" cy="680" r="240" fill="#2b2621" opacity="0.06"/>

  <!-- abstract robot vacuum silhouette (top-down disc) -->
  <g transform="translate(600,375)" fill="none" stroke="#fff" stroke-width="14" opacity="0.92">
    <circle cx="0" cy="0" r="170"/>
    <circle cx="0" cy="0" r="60" stroke-dasharray="10 12"/>
    <circle cx="0" cy="-140" r="14" fill="#fff" stroke="none"/>
  </g>

  <text x="60" y="700" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.85">好物研究所 · 封面圖示意，請替換成實拍照片</text>
</svg>
