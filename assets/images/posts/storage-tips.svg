<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="小坪數收納推薦封面圖佔位">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bcd3ba"/>
      <stop offset="100%" stop-color="#6b8f71"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#g3)"/>
  <circle cx="1030" cy="130" r="220" fill="#ffffff" opacity="0.08"/>
  <circle cx="110" cy="640" r="240" fill="#2b2621" opacity="0.06"/>

  <!-- abstract storage shelf silhouette -->
  <g transform="translate(420,160)" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <rect x="0" y="0" width="360" height="360" rx="16"/>
    <line x1="0" y1="120" x2="360" y2="120"/>
    <line x1="0" y1="240" x2="360" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
  </g>

  <text x="60" y="700" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.85">好物研究所 · 封面圖示意，請替換成實拍照片</text>
</svg>
