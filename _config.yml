title: GoodsLab
tagline: Honest Unboxing Reviews & Smart Storage Picks
description: >-
  GoodsLab covers real-world unboxing reviews and home storage recommendations,
  built from hands-on testing so you can buy smarter and skip the duds.
# Currently served as a GitHub Pages *project* site at https://tobhung.github.io/goods-lab-blog/,
# so baseurl must be "/goods-lab-blog" or all asset/internal links 404.
# Once you connect your Cloudflare domain (which serves from the root), set url to your domain
# and change baseurl back to "" — see README.md for the full custom-domain steps.
url: ""
baseurl: "/goods-lab-blog"
lang: en
locale: en_US

author:
  name: GoodsLab Editorial Team

# Categories are plain strings, Jekyll auto-indexes them under site.categories
markdown: kramdown
kramdown:
  input: GFM
permalink: /articles/:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
