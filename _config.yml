title: GoodsLab
tagline: Honest Unboxing Reviews & Smart Storage Picks
description: >-
  GoodsLab covers real-world unboxing reviews and home storage recommendations,
  built from hands-on testing so you can buy smarter and skip the duds.
# Served at the custom domain (via CNAME), which serves from the root — hence empty baseurl.
url: "https://whatwebuy.us"
baseurl: ""
lang: en
locale: en_US

author:
  name: GoodsLab Editorial Team

# Categories are plain strings, Jekyll auto-indexes them under site.categories
markdown: kramdown
kramdown:
  input: GFM
permalink: /articles/:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
